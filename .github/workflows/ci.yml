name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- CI JOB (Build & Test) ---
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: my-maven-app-1.0-SNAPSHOT.jar # Passing the artifact name to the deploy job
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test
      run: mvn clean package # 'package' creates the actual runnable .jar file

    # Upload the compiled JAR so the deployment job can access it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: target/*.jar

  # --- CD JOB (Deploy to Dev Environment) ---
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build # This ensures deployment ONLY happens if the build/test passes!
    
    steps:
    # 1. Download the JAR file created in the build job
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-app

    # 2. Copy the file to your Dev environment and restart the service
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}          # Your EC2 Public IP or Public DNS
        username: ${{ secrets.EC2_USERNAME }}  # The default OS user (e.g., ubuntu or ec2-user)
        key: ${{ secrets.EC2_SSH_KEY }}       # The contents of your AWS .pem private key file
        source: "*.jar"
        target: "/home/${{ secrets.EC2_USERNAME }}/app" # The directory on EC2 where the file will land